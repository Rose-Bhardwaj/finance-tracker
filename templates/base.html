<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Personal Finance Tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="app-shell">
    <nav class="navbar glass">
      <div class="navbar-left">
        <span class="logo">₹ Personal Finance Tracker</span>
      </div>
      <div class="navbar-right">
        <a href="{{ url_for('index') }}">Home</a>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('assistant') }}">AI Assistant</a>
        <button id="modeToggle" class="mode-toggle" type="button">☾</button>
      </div>
    </nav>

    <!-- Global notifications (near/over budget) -->
    {% if notifications %}
    <div class="notification-bar">
      {% for note in notifications %}
        <div class="notification">{{ note }}</div>
      {% endfor %}
    </div>
    {% endif %}

    <main class="page glass">
      {% block content %}{% endblock %}
    </main>
  </div>

  <script>
    // Dark/light mode toggle using localStorage
    (function() {
      const toggle = document.getElementById('modeToggle');
      const body = document.body;
      const saved = localStorage.getItem('pf-theme');
      if (saved === 'light') {
        body.classList.add('light-mode');
        if (toggle) toggle.textContent = '☀';
      }
      if (toggle) {
        toggle.addEventListener('click', () => {
          body.classList.toggle('light-mode');
          const isLight = body.classList.contains('light-mode');
          toggle.textContent = isLight ? '☀' : '☾';
          localStorage.setItem('pf-theme', isLight ? 'light' : 'dark');
        });
      }
    })();
  </script>
</body>
</html>
